services:
  db:
    image: postgres:15-alpine
    container_name: jordan_postgres
    restart: always
    environment:
      POSTGRES_USER: jordan_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: jordan_core_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jordan_user -d jordan_core_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    container_name: jordan_fastapi
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./frontend:/frontend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://jordan_user:${POSTGRES_PASSWORD}@db/jordan_core_db
      BOT_TOKEN: ${BOT_TOKEN:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-internal-key}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/locations')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  bot:
    build: ./bot
    container_name: jordan_bot
    restart: on-failure
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-}
      WEBAPP_URL: ${WEBAPP_URL:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-secret-key}
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

  miniapp:
    build: ./miniapp
    container_name: jordan_miniapp
    restart: always
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
